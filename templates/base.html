{% load static %}
<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e14" />
    <title>{% block title %}~/rahmat{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}" />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              mono: ["JetBrains Mono", "Fira Code", "monospace"],
            },
            colors: {
              term: {
                bg: "#0a0e14",
                surface: "#0d1117",
                card: "#161b22",
                border: "#30363d",
                text: "#c9d1d9",
                dim: "#8b949e",
                blue: "#58a6ff",
                green: "#3fb950",
                purple: "#bc8cff",
                orange: "#d29922",
                red: "#f85149",
                cyan: "#39c5cf",
                yellow: "#d29922",
              },
            },
          },
        },
      };

      if (localStorage.getItem("theme") === "light") {
        document.documentElement.classList.remove("dark");
      } else {
        document.documentElement.classList.add("dark");
      }
    </script>

    <style>
      * {
        font-family: "JetBrains Mono", "Fira Code", monospace;
        scrollbar-width: thin;
        scrollbar-color: #30363d #0d1117;
      }

      html,
      body {
        overflow-x: hidden;
      }

      body {
        background: #0a0e14;
        color: #c9d1d9;
        padding-bottom: 40px; /* space for status bar */
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0d1117;
      }
      ::-webkit-scrollbar-thumb {
        background: #30363d;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #58a6ff;
      }

      /* Terminal Window */
      .terminal {
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 8px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }

      .terminal-header {
        padding: 10px 14px;
        display: flex;
        align-items: center;
        background: #161b22;
        border-bottom: 1px solid #30363d;
      }

      .terminal-dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        margin-right: 7px;
        transition: transform 0.2s;
      }

      .terminal-dot:hover {
        transform: scale(1.25);
      }

      .terminal-body {
        padding: 20px;
      }

      @media (max-width: 640px) {
        .terminal-body {
          padding: 16px;
        }
      }

      /* Scanlines overlay - subtle */
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 40;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.04) 2px,
          rgba(0, 0, 0, 0.04) 4px
        );
        opacity: 0.6;
      }

      @media (max-width: 768px) {
        .scanlines {
          display: none;
        }
      }

      /* Cursor blink */
      .cursor {
        display: inline-block;
        width: 10px;
        height: 1.1em;
        background: #58a6ff;
        animation: blink 1s steps(2) infinite;
        vertical-align: text-bottom;
        margin-left: 2px;
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }
        51%,
        100% {
          opacity: 0;
        }
      }

      /* Grid background */
      .grid-bg {
        background-image:
          linear-gradient(rgba(88, 166, 255, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(88, 166, 255, 0.06) 1px, transparent 1px);
        background-size: 30px 30px;
      }

      /* Glow effects */
      .glow-blue {
        box-shadow: 0 0 30px rgba(88, 166, 255, 0.3);
      }
      .glow-green {
        box-shadow: 0 0 30px rgba(63, 185, 80, 0.3);
      }
      .glow-purple {
        box-shadow: 0 0 30px rgba(188, 140, 255, 0.3);
      }

      /* Matrix rain background */
      .matrix-rain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        opacity: 0.35;
      }

      @media (max-width: 768px) {
        .matrix-rain {
          opacity: 0.15;
        }
      }

      /* Hover effect for cards */
      .term-hover {
        transition: transform 0.3s ease, border-color 0.3s ease,
          box-shadow 0.3s ease;
      }
      .term-hover:hover {
        border-color: #58a6ff;
        box-shadow: 0 0 24px rgba(88, 166, 255, 0.18),
          0 8px 32px rgba(0, 0, 0, 0.4);
        transform: translateY(-3px);
      }

      /* Status bar */
      .status-bar {
        background: #161b22;
        border-top: 1px solid #30363d;
        color: #8b949e;
        font-size: 12px;
      }

      /* ASCII art */
      .ascii-art {
        line-height: 1.15;
        color: #58a6ff;
        text-shadow: 0 0 20px rgba(88, 166, 255, 0.4);
        font-size: 0.65rem;
        overflow-x: auto;
      }

      @media (min-width: 640px) {
        .ascii-art {
          font-size: 0.85rem;
        }
      }
      @media (min-width: 1024px) {
        .ascii-art {
          font-size: 1rem;
        }
      }

      /* Nav link active state */
      .nav-link {
        position: relative;
      }
      .nav-link::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -4px;
        width: 0;
        height: 1px;
        background: #3fb950;
        transition: width 0.25s ease;
      }
      .nav-link:hover::after {
        width: 100%;
      }

      /* Mobile menu */
      .mobile-menu {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s ease, opacity 0.25s ease;
        opacity: 0;
      }
      .mobile-menu.open {
        max-height: 500px;
        opacity: 1;
      }

      /* Blinking prompt in nav */
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .pulse-dot {
        animation: pulse-dot 2s ease-in-out infinite;
      }

      /* Reduce motion for accessibility */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Code block scrolling */
      pre,
      code {
        word-wrap: break-word;
      }
      pre {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* Selection color */
      ::selection {
        background: rgba(88, 166, 255, 0.3);
        color: #f0f6fc;
      }
    </style>
  </head>
  <body class="bg-[#0a0e14] text-[#c9d1d9]">
    <!-- Matrix Rain Background -->
    <canvas id="matrixCanvas" class="matrix-rain"></canvas>

    <!-- Scanlines overlay -->
    <div class="scanlines"></div>

    <!-- Terminal Navigation -->
    <nav
      class="fixed top-0 w-full z-50 bg-[#0d1117]/95 backdrop-blur-md border-b border-[#30363d]"
    >
      <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between items-center h-14">
          <!-- Logo -->
          <!-- Logo -->
          <a
            href="{% url 'home' %}"
            class="flex items-center gap-2.5 group"
            aria-label="Home"
          >
            <img
              src="{% static 'images/rahmat-website-logo.png' %}"
              alt="Logo"
              class="h-8 w-8 object-contain rounded transition-transform group-hover:scale-110"
            />
            <span
              class="text-[#58a6ff] font-bold text-sm sm:text-base group-hover:text-[#3fb950] transition-colors"
            >
              ~/rahmat
            </span>
            <span
              class="hidden sm:inline-block w-2 h-4 bg-[#58a6ff] pulse-dot align-middle"
            ></span>
          </a>

          <!-- Desktop nav -->
          <div class="hidden md:flex items-center space-x-5">
            <a
              href="{% url 'home' %}"
              class="nav-link text-[#8b949e] hover:text-[#58a6ff] transition-colors text-xs lg:text-sm"
            >
              <span class="text-[#3fb950]">$</span> cd ~
            </a>
            <a
              href="{% url 'project_list' %}"
              class="nav-link text-[#8b949e] hover:text-[#58a6ff] transition-colors text-xs lg:text-sm"
            >
              <span class="text-[#3fb950]">$</span> ls projects/
            </a>
            <a
              href="{% url 'article_list' %}"
              class="nav-link text-[#8b949e] hover:text-[#58a6ff] transition-colors text-xs lg:text-sm"
            >
              <span class="text-[#3fb950]">$</span> cat articles/
            </a>
            <a
              href="{% url 'snippet_list' %}"
              class="nav-link text-[#8b949e] hover:text-[#58a6ff] transition-colors text-xs lg:text-sm"
            >
              <span class="text-[#3fb950]">$</span> vim snippets/
            </a>
            <a
              href="{% url 'gallery_list' %}"
              class="nav-link text-[#8b949e] hover:text-[#58a6ff] transition-colors text-xs lg:text-sm"
            >
              <span class="text-[#3fb950]">$</span> open gallery/
            </a>
          </div>

          <!-- Right side: version, theme toggle, mobile menu button -->
          <div class="flex items-center gap-3">
            <span
              class="hidden lg:inline text-[#8b949e] text-xs border border-[#30363d] px-2 py-0.5 rounded"
            >
              v1.0.0
            </span>
            <button
              id="themeToggle"
              class="text-[#8b949e] hover:text-[#58a6ff] transition-colors p-2"
              aria-label="Toggle theme"
            >
              <i class="fas fa-terminal"></i>
            </button>
            <button
              id="mobileMenuBtn"
              class="md:hidden text-[#8b949e] hover:text-[#58a6ff] transition-colors p-2"
              aria-label="Toggle menu"
              aria-expanded="false"
            >
              <i class="fas fa-bars text-lg" id="menuIcon"></i>
            </button>
          </div>
        </div>

        <!-- Mobile menu -->
        <div id="mobileMenu" class="mobile-menu md:hidden pb-4">
          <div class="flex flex-col gap-1 pt-2 border-t border-[#30363d]">
            <a
              href="{% url 'home' %}"
              class="text-[#8b949e] hover:text-[#58a6ff] hover:bg-[#161b22] transition-all text-sm px-3 py-2.5 rounded"
            >
              <span class="text-[#3fb950]">$</span> cd ~
            </a>
            <a
              href="{% url 'project_list' %}"
              class="text-[#8b949e] hover:text-[#58a6ff] hover:bg-[#161b22] transition-all text-sm px-3 py-2.5 rounded"
            >
              <span class="text-[#3fb950]">$</span> ls projects/
            </a>
            <a
              href="{% url 'article_list' %}"
              class="text-[#8b949e] hover:text-[#58a6ff] hover:bg-[#161b22] transition-all text-sm px-3 py-2.5 rounded"
            >
              <span class="text-[#3fb950]">$</span> cat articles/
            </a>
            <a
              href="{% url 'snippet_list' %}"
              class="text-[#8b949e] hover:text-[#58a6ff] hover:bg-[#161b22] transition-all text-sm px-3 py-2.5 rounded"
            >
              <span class="text-[#3fb950]">$</span> vim snippets/
            </a>
            <a
              href="{% url 'gallery_list' %}"
              class="text-[#8b949e] hover:text-[#58a6ff] hover:bg-[#161b22] transition-all text-sm px-3 py-2.5 rounded"
            >
              <span class="text-[#3fb950]">$</span> open gallery/
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="relative z-10">{% block content %}{% endblock %}</main>

    <!-- Status Bar Footer -->
    <footer class="status-bar fixed bottom-0 w-full z-50">
      <div class="max-w-7xl mx-auto px-4 py-1.5 sm:py-2 flex justify-between items-center gap-2">
        <span class="truncate">© 2024 ~/rahmat</span>
        <span class="hidden sm:inline text-[#8b949e]">UTF-8 | LF | Monospace</span>
        <span class="truncate">Ln 1, Col 1</span>
      </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 600,
        once: true,
      });

      /* ─── Matrix Rain Effect ─── */
      const canvas = document.getElementById("matrixCanvas");
      const ctx = canvas.getContext("2d");

      function sizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      sizeCanvas();

      const matrix =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*()_+-=[]{}|;:,.<>?/";
      const fontSize = 14;
      let columns = Math.floor(canvas.width / fontSize);
      let drops = new Array(columns)
        .fill(0)
        .map(() => Math.random() * -100);

      function drawMatrix() {
        ctx.fillStyle = "rgba(10, 14, 20, 0.06)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(88, 166, 255, 0.35)";
        ctx.font = fontSize + "px 'JetBrains Mono', monospace";

        for (let i = 0; i < drops.length; i++) {
          const text = matrix[Math.floor(Math.random() * matrix.length)];
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }

      // Throttle to ~30fps for smooth performance
      let matrixInterval = setInterval(drawMatrix, 60);

      window.addEventListener("resize", () => {
        sizeCanvas();
        columns = Math.floor(canvas.width / fontSize);
        drops = new Array(columns).fill(0).map(() => Math.random() * -100);
      });

      /* Pause matrix rain when tab is not visible (saves CPU) */
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          clearInterval(matrixInterval);
        } else {
          matrixInterval = setInterval(drawMatrix, 60);
        }
      });

      /* ─── Mobile Menu ─── */
      const mobileMenuBtn = document.getElementById("mobileMenuBtn");
      const mobileMenu = document.getElementById("mobileMenu");
      const menuIcon = document.getElementById("menuIcon");

      if (mobileMenuBtn) {
        mobileMenuBtn.addEventListener("click", () => {
          const isOpen = mobileMenu.classList.toggle("open");
          mobileMenuBtn.setAttribute("aria-expanded", isOpen);
          menuIcon.className = isOpen ? "fas fa-times text-lg" : "fas fa-bars text-lg";
        });

        // Close menu when clicking a link
        mobileMenu.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", () => {
            mobileMenu.classList.remove("open");
            menuIcon.className = "fas fa-bars text-lg";
            mobileMenuBtn.setAttribute("aria-expanded", "false");
          });
        });
      }

      /* ─── Theme Toggle ─── */
      const themeToggle = document.getElementById("themeToggle");
      if (themeToggle) {
        themeToggle.addEventListener("click", () => {
          document.documentElement.classList.toggle("dark");
          const isDark = document.documentElement.classList.contains("dark");
          localStorage.setItem("theme", isDark ? "dark" : "light");
          themeToggle.innerHTML = isDark
            ? '<i class="fas fa-terminal"></i>'
            : '<i class="fas fa-sun"></i>';
        });

        // Set initial icon based on current state
        if (!document.documentElement.classList.contains("dark")) {
          themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        }
      }
    </script>
  </body>
</html>
